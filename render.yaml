services:
  - type: web
    name: telegram-downloader-bot
    runtime: node
    # `bash build.sh` (not `./build.sh`): the script is committed without the
    # executable bit (Windows checkout), so `./build.sh` fails with
    # "Permission denied" on Render.
    buildCommand: bash build.sh
    # Direct node start (same as `npm start`): SIGTERM from Render reaches the
    # process itself instead of going through an npm wrapper.
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: YT_DLP_PATH
        value: yt-dlp
      - key: MAX_FILE_SIZE_MB
        value: 50
      # YouTube cookies, Render-safe (OPTIONAL — only for age-gated/private
      # videos or IP rate-limits; public videos work cookie-free). Paste the
      # full text of cookies.txt here (or base64). The bot rewrites cookies.txt
      # from it on every boot, so sessions survive restarts/redeploys.
      - key: COOKIES_CONTENT
        sync: false
      # YouTube quality cap: 720p keeps downloads fast + under the 50MB limit.
      - key: YOUTUBE_MAX_HEIGHT
        value: 720
      # Fast YouTube path (no setup): Invidious is ON by default. Set to false
      # to force yt-dlp-only.
      # - key: INVIDIOUS_ENABLED
      #   value: true
      # Optional: your self-hosted Cobalt instance (all platforms, fastest
      # when set). Public cobalt.tools is blocked for YouTube — self-host only.
      # - key: COBALT_API_URL
      #   sync: false
      # Optional: residential proxy when the datacenter IP is hard-blocked.
      # - key: YT_DLP_PROXY
      #   sync: false
      # Heal stale deploys without manual redeploys: best-effort `yt-dlp -U`
      # on every boot (YouTube breaks builds older than ~2 weeks on its own).
      - key: YTDLP_AUTO_UPDATE
        value: true
      # Self-ping interval (min). Stays under Render's ~15 min idle spin-down.
      - key: KEEPALIVE_INTERVAL_MINUTES
        value: "10"
      # Pinterest MP4 normalization: a FULL ffmpeg re-encode. This is REQUIRED
      # for Pinterest videos — the raw MP4s carry an edit list / HEVC framing
      # that Telegram's player renders as BLACK VIDEO with working audio. Keep
      # it ON (only disable to trade picture for speed on a very slow host).
      - key: PINTEREST_NORMALIZE
        value: "true"
      # x264 preset for that re-encode: "superfast" keeps the encode short on a
      # 0.1-CPU free instance (raise to "veryfast"/"medium" on a paid plan).
      - key: PINTEREST_X264_PRESET
        value: "superfast"
      # Stability on the free plan (all optional — defaults are safe):
      # max simultaneous downloads (each spawns yt-dlp/ffmpeg children).
      # - key: MAX_CONCURRENT_DOWNLOADS
      #   value: 2
      # Overall per-download time budget (ms) before the user gets a retry
      # message. Raised because the Pinterest ffmpeg re-encode now runs inside
      # this budget on a 0.1-CPU instance.
      - key: DOWNLOAD_TIMEOUT_MS
        value: "600000"
      # Per yt-dlp attempt timeout (ms) / public-API request timeout (ms).
      # - key: YT_DLP_ATTEMPT_TIMEOUT_MS
      #   value: 150000
      # - key: PUBLIC_API_TIMEOUT_MS
      #   value: 10000
